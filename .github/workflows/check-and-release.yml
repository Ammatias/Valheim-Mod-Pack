name: Check and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Update-Valheim.ps1
            /release-source.json
            /tools/
            /tests/
            /Midgard/Midgard-Modpack.bat
            /Helheim/Helheim-Modpack.bat
      - name: Windows PowerShell 5.1 and CMD tests
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $result = @{success=$false; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; message=''; stack=''}
          try { .\tests\Updater.Tests.ps1; $result.success=$true }
          catch {
            $result.message=$_.Exception.Message
            $result.stack=$_.ScriptStackTrace
            $message = ($_.Exception.Message + "`n" + $_.ScriptStackTrace).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows updater test::$message"
          }
          $report=Join-Path $env:RUNNER_TEMP 'windows-result.json'
          [IO.File]::WriteAllText($report,($result | ConvertTo-Json))
          python tools/report_check.py $report
          if (-not $result.success) { throw $result.message }
      - name: Python syntax
        run: python -m py_compile tools/build_pack.py tools/import_release.py tools/full_pack.py tools/repack_releases.py tools/publish_unpacked.py tools/file_inventory.py tools/update_release.py
      - name: Full ZIP packaging tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
  publish:
    needs: windows-tests
    if: startsWith(github.event.head_commit.message, 'publish:') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Verify components and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/repack_releases.py release-source.json --repo "$GITHUB_REPOSITORY"
  unpacked:
    needs: [windows-tests, publish]
    if: always() && needs.windows-tests.result == 'success' && (startsWith(github.event.head_commit.message, 'mirror:') || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          lfs: true
      - name: Verify and publish unpacked files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_unpacked.py --repo "$GITHUB_REPOSITORY"
