msg_spring: "Где тает снег и сходит лёд,\nНа зелень пашен викинг идёт.\nО славе песню он поёт —\nВесной он крепче, чем в прошлый год."
msg_summer: "В летний зной ладьи скользят\nПо искристым волнам, не зная преград.\nПод жарким солнцем, в золотом огне,\nДух викинга царит в своей стране."
msg_fall: "Листва летит, пестра, светла —\nТо осень свой узор сплела.\nСквозь мглу утра и пир жнивья\nНе гаснет викинга душа."
msg_winter: "Где ветер ледяной ревёт,\nОгонь викинга не умрёт.\nСредь снега, грозен и суров,\nВ тисках зимы он к бою готов."

