[Meads]

## Meads never stack inside an exclusion group: a newer drink (ours or a vanilla member of the group) replaces the running one, re-drinking refreshes. Off = vanilla rules (re-drink refused while the effect runs).
# Setting type: Boolean
# Default value: true
ExclusionGroups = true

## No mead or potion has a cooldown: drinking one while its effect (or one of the same category) runs replaces that effect with a fresh one instead of being refused; effects never stack. Healing, stamina and eitr meads also end when their restore is over instead of lingering for the vanilla cooldown. [Synced with Server]
# Setting type: Boolean
# Default value: true
NoCooldown = true

## Lingering regen meads (whose only effect is a health, stamina or eitr regen multiplier, e.g. lingering healing mead) get their own category, so healing / stamina / eitr meads can still be drunk while the long regen buff runs, and the other way round. A second regen buff of one kind replaces the first. [Synced with Server]
# Setting type: Boolean
# Default value: true
SeparateRegenBuffs = true

## Epic Loot effect PotionPotency (+X% potion strength): meads and potions drunk while wearing it restore more (health, stamina, eitr) and their buffs are stronger (regen, carry weight, speed, skill levels, stamina savings, damage, parry bonus, adrenaline gain, stagger taken down to -50%). Resistance meads keep their tier. [Synced with Server]
