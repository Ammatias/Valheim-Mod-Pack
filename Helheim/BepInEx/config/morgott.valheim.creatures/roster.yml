# Morgott.Creatures: roster creatures (M4, server copy wins, synced to every client). Imported models, our own numbers.
# health = base health at level 1 (rarity.yml / stats.yml / infusions.yml apply on top, like any creature).
# attacks: damage per attack (blunt, slash, pierce, fire, frost, lightning, poison, spirit); the attack set and
# animations belong to the model. drops: item prefabs (vanilla or ours: CR_Trophy<Name>, CR_FoxPelt, CR_RazorbackHide, CR_BigCatPelt,
# CR_RazorbackTusk, CR_GrizzlyPelt, CR_ProwlerFang), min..max at chance 0..1, scaled by loot.yml tiers. Each creature
# drops what the vanilla creature of its biome and role drops (meat, bone ...) but only its own hide, never another
# animal's (big cats share CR_BigCatPelt; LoxPelt = Shaggy Pelt of Lox, Mammoth, Yeti); our pelts make capes and are cut
# into LeatherScraps at the workbench (no hide -> hide conversion), the tusk is worked into bone.
# faction: vanilla Character.Faction (Players, AnimalsVeg, ForestMonsters, Undead, Demon, MountainMonsters, SeaMonsters,
# PlainsMonsters, Boss, MistlandsMonsters, Dverger, PlayerSpawned, TrainingDummy, DeepNorth); who fights whom is the vanilla
# faction table (BaseAI.IsEnemy): e.g. Undead attack every faction but Undead, Demon and Boss. Required.
# spawns: natural world spawns (vanilla SpawnSystem): chance % per try, interval s, max alive near a player, group
# [min, max] within radius m, day/night, forest/clearing, altitude [min, max] m, levels [min, max] (the rarity roll
# picks inside them; 3 = Rare possible), depth [min, max] m of ocean under the spawn point (0, 0 = any). Vanilla never
# spawns inside a player base. enabled: false = no spawns (the prefab still exists, so saved creatures stay valid).
# Vanilla first: the roster is a flavour layer. Tiers (chance % / interval s): common 10 / 300, uncommon 8 / 600,
# rare 5 / 3000, very rare 3 / 4000; max 1 (packs 2). Vanilla staples spawn far more (Boar 50 / 150 max 4, Deer
# 50 / 100 max 4, Black Forest Greydwarf at night 100 / 60 max 6).
# share: the roster's share in percent of the creatures near a spawning player. Vanilla caps every species on its own,
# so each species added would add its max; a roster spawn is refused while roster / (roster + vanilla) would exceed
# this (no vanilla creature near = no roster spawn). 0 = no roster spawns at all.
# vanilla: vanilla creature prefabs (names as in the game): health = base health at level 1 (replaces the prefab's),
# damage = factor on its hits on players, on top of CreatureDamage's role factor (1 = unchanged); faction = its Character.Faction
# (omitted = the prefab's own). health 0 or omitted = the prefab's own.
# Balance (docs\roster-balance.md, unit test RosterBalanceCheck): health from size x build against the biome's vanilla peer,
# armored DPS <= 1.5 x the vanilla encounter it stands in for, HP x DPS within that encounter's fight budget.
