# Morgott.Creatures: fixed stats per rarity tier (server copy wins). Multipliers ON TOP of vanilla level scaling
# (health x level, damage x (1 + 0.5 x (level - 1))); 1 = vanilla. Tiers: Normal, Magic, Rare, Unique (bosses).
# bosses: strength by progression (config Bosses.ProgressionMultiplier): health and damage x (1 + value x later
# bosses defeated), later = after the boss' own defeated_* key in the order eikthyr, gdking, bonemass, dragon,
# goblinking, queen, fader. 1.0 / 0.5 = the old one-star-per-later-boss strength.
version: 2
tiers:
  Normal: { health: 1, damage: 1 }
# Behaviour over HP (rarity affixes, schema 5): Magic health 2 x 0.75 = 1.5, damage 1.5 x 0.7333 = 1.1; Rare health 3 x 0.6667 = 2.0,
# damage 2.0 x 0.6 = 1.2 of a Normal creature.
  Magic:  { health: 0.75, damage: 0.7333 }
  Rare:   { health: 0.6667, damage: 0.6 }
  Unique: { health: 1, damage: 1 }
bosses: { healthPerLaterBoss: 1.0, damagePerLaterBoss: 0.5 }
