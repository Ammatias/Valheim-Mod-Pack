[EpicLootChests]

## Epic Loot enchanting, augmenting, disenchanting, sacrificing, converting, runes, upgrades, tempering, the merchant and treasure maps also use materials from nearby player-built chests you may open. Tempering takes them through ValheimPlus [CraftFromChest], so keep that on with a range of at least Range. [Synced with Server]
# Setting type: Boolean
# Default value: true
Enabled = true

## Radius in meters around the player within which chests are used. [Synced with Server]
# Setting type: Single
# Default value: 20
# Acceptable value range: From 1 to 50
Range = 20

## Item drawers (RossItemDrawers) within Range count as chests too: their stored items pay Epic Loot costs, taken through the drawer's own owner write. No effect without ItemDrawers. [Synced with Server]
# Setting type: Boolean
# Default value: true
Drawers = true

[EpicLootFixes]

## Falls, drowning, water, smoke, the world edge and Ashlands lava / ocean (hits without an attacker) no longer trigger Eitr Shield, Coinplated, Auto Meads, OffSet, adrenaline on damage taken or Bloodrage, so they spend no eitr, coins, meads or cooldowns. Damage reductions and damage over time from real attacks stay. [Synced with Server]
# Setting type: Boolean
# Default value: true
EnvironmentHitsSkipEffects = true

## Chain Lightning's jumps deal the rolled (scaled) damage of the first strike instead of the full prefab damage whatever the roll. The jump chance stays Epic Loot's. [Synced with Server]
# Setting type: Boolean
# Default value: true
ChainLightningJumpDamage = true

## Bulk Up's health regen penalty takes its share of the regen that is left after other modifiers (wet, cold), instead of subtracting its full value from it, which could stop regen entirely. [Synced with Server]
# Setting type: Boolean
# Default value: true
BulkUpRegenShare = true

## Feint does not roll on a hit you block from the front with stamina left, so the block or parry keeps its stagger, Blocking experience and adrenaline. Without stamina the guard breaks and Feint still rolls. [Synced with Server]
