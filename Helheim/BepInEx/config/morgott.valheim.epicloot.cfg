[PlayerLoot]

## Epic Loot rolls its loot table once more for every extra player near the kill, so a group gets the loot volume its numbers earn. Only Epic Loot's own drops: a creature's vanilla drop list is never touched. [Synced with Server]
# Setting type: Boolean
# Default value: true
Enabled = true

## How much loot each player beyond the first adds, as a fraction of a solo kill: 0.5 means 3 players get 2.0x. 1.0 makes it linear. A fraction is paid as a chance, never truncated: 2.4x is two rolls plus a 40% chance of a third. [Synced with Server]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 4
PerExtraPlayer = 0.5

## Most players counted. The count itself is vanilla's Game.GetPlayerDifficulty, which ValheimPlus and StarLevelSystem already override and which vanilla stops at Game.m_difficultyScaleMaxPlayers (5); a value above that counts the players within Game.m_difficultyScaleRange (100 m) the way Epic Loot counts them for boss trophies, so a bigger group keeps earning. [Synced with Server]
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 20
MaxPlayers = 5

