[EnchantBudget]

## At most this many defensive Epic Loot effects (armor, health, resistances, avoidance, health regen, energy shield) roll on one helmet, chest, legs or cape; further effects of higher rarities are offense or utility. 0 = no limit. Items already rolled keep their effects. [Synced with Server]
