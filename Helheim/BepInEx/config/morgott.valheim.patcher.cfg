[Audio]

## Sounds of mods whose asset bundle ships its own copy of the game's audio mixer (OreMines' rock hits, rock breaks and mine gates) follow the game's master and sound effect volume, like the game's own sounds, instead of always playing at full volume. Takes effect on the next game launch. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
ModSoundsFollowVolume = true

[BlockFacing]

## Raising a block turns your body to where the camera looks fast and smoothly (easing out at the end), so the shield covers the direction you look at instead of turning at walking speed. [Synced with Server]
# Setting type: Boolean
# Default value: true
Enabled = true

## Fastest turn while raising a block, degrees per second (vanilla turns at 300). [Synced with Server]
# Setting type: Single
# Default value: 1080
# Acceptable value range: From 300 to 2000
MaxTurnSpeed = 1080

## A block turn moves the body, not just spins it: chest and shield lead, the hips follow and the feet step around. Looks only (every client animates it from the synced turn); facing, block timing and stamina are unchanged. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
TurnAnimation = true

[BuriedLoot]

## Raise world objects you interact with (chests, pickables such as buried remains and treasure, item spawners, any mod's interactables) that sit entirely under the ground, until about 0.4 m shows, so they can be reached without digging - [Terrain] LockTerrain stops the pickaxe from digging them out. Each object is checked by its owner once the ground around it has loaded; a raised position is saved in the world. Never moved: anything built by players, creatures, loose items, moving objects (carts, ships), tombstones, tar pits (still diggable) and OreMines mines. Applies to objects checked from then on. [Synced with Server]
# Setting type: Boolean
# Default value: true
Enabled = true

