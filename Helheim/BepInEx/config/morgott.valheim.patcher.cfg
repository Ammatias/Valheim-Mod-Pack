[FallDamage]

## Fall damage counts the speed of the landing instead of the highest point of the airtime: the fall height is at most the height a free fall needs to reach the landing speed. A short slow drop after a long time in the air (glide, lift, falling ship) no longer hits like one long fall. Damage per height is vanilla: none up to 4 m, full at 20 m. [Synced with Server]
# Setting type: Boolean
# Default value: true
ImpactSpeed = true

## Creatures take fall damage too (vanilla: players only), from the same heights as players. [Synced with Server]
# Setting type: Boolean
# Default value: true
Creatures = true

## Creature fall damage as a share of its max health at full fall damage (a 20 m fall). 1 = a 20 m fall kills, 12 m takes half its health; 0.5 = half that. [Synced with Server]
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
CreatureMultiplier = 1

## Bosses take creature fall damage too. [Synced with Server]
# Setting type: Boolean
# Default value: false
Bosses = false

