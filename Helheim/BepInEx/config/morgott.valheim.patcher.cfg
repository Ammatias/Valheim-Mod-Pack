[Effects]

## Mead, potion and other consumable effects keep their remaining time over a logout or reconnect (stored in the character save). Weather, rest, gear and aura effects re-derive as usual; poison and burning are not kept. Read at every save and load. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
