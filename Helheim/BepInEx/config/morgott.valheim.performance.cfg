[Net.SendScheduling]

## Server/host: per-peer 'send queue is congested' signal (any backend) + adaptive per-connection Steam send-rate pin steered between SteamRates' Send Rate Min/Max KB (Steam only; PlayFab has no per-connection rate knob).
# Setting type: Boolean
# Default value: true
Enabled = true

## A peer counts as congested when its send queue is above this % of SteamRates 'ZDO Queue Limit KB'. Rate raises resume only below half of it (hysteresis).
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 10 to 100
Congestion Threshold Percent = 50

## Dedicated server: let the adaptive rate back off on the ping read through the game-server Steam interface (vanilla GetConnectionQuality uses the client interface and returns 0 there, bug 1). The reading itself always goes to pf stats (steamPing*/steamOut*). Off until verified against a real Steam client: the Goldberg lab reports a constant 10 ms and 0 B/s out.
# Setting type: Boolean
# Default value: true
Dedicated Steam Ping = true

## Steam only. Pin per-connection SendRateMin=SendRateMax between SteamRates 'Send Rate Min/Max KB': x0.5 after 3 consecutive bad-ping ticks (1.5 s each), x1.1 back up after 2 healthy ticks (queue below threshold, ping near baseline).
# Setting type: Boolean
# Default value: true
Adaptive Send Rate = true

## With Adaptive Send Rate: a pinned connection (Steam's own congestion control is off then) also backs off x0.75 after 3 ticks in which the peer received under 95% of our packets while we filled at least half the pin; raises and probes wait until it is back at 98%. After a loss back-off loss only holds the rate for 30 s (the peer's report lags); a back-off that did not improve delivery by 1 point marks the loss as not ours (radio, route) and loss is ignored for 120 s.
# Setting type: Boolean
# Default value: true
Loss Back-Off = true

## Steam: each peer's ZDO queue cap follows its link, rate x (ping + one send sweep) (the bytes in flight plus one refill), where rate = the adaptive pin or SteamRates 'Send Rate Max KB'; bounded by vanilla 10 KB and SteamRates 'ZDO Queue Limit KB'. A slow or backed-off link then queues less stale ZDO state. Off = the fixed 'ZDO Queue Limit KB' for everyone.
# Setting type: Boolean
# Default value: true
Adaptive Queue Window = true

## Server: time the game's own once-a-second keepalive (ping/pong, every backend, vanilla clients too) per player: pf peers / pf stats gamePing* for every link (crossplay/PlayFab included), and the Steam queue window's ping when the Steam status read gives none. The adaptive rate back-off keeps reading only Steam's own ping (the game round trip grows with the queue the pin itself builds).
# Setting type: Boolean
# Default value: true
Game Ping = true

