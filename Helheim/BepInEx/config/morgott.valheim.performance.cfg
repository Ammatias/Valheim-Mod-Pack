[Net.Compression]

## Deflate network packages between two Morgott.Performance peers (protocol v2, negotiated per connection at connect; a peer without the mod or with an older protocol stays plain). Steam sockets only: PlayFab (crossplay) sockets keep vanilla zlib, which compresses tighter off the game thread (docs\phase-notes\playfab-compression.md).
# Setting type: Boolean
# Default value: true
Enabled = true

## Packages smaller than this are sent plain (deflate gains nothing on small messages).
# Setting type: Int32
# Default value: 512
# Acceptable value range: From 32 to 4096
Min Package Bytes = 512

## Run the framing round-trip + corruption fuzz (10k truncated / bit-flipped / oversize frames) at boot and log the result (no network needed).
# Setting type: Boolean
# Default value: false
Self Test = false

## Per RPC method: after 8 packages in a row that deflate could not shrink by 15 %, send that method plain for 60 s without trying (saves the CPU of futile deflates). Wire format unchanged.
# Setting type: Boolean
# Default value: true
Skip Learning = true

## Reuse one outgoing package buffer instead of allocating a new one per send (the socket copies it before returning).
# Setting type: Boolean
# Default value: true
Pooled Buffers = true

