Zone Instance Index Verify Every = 100

[Perf.ShaderWarmup]

## Shader warm-up. Prefab Warm (any graphics API, D3D11 included): on world load, draws each distinct shader/keyword combination of the loaded prefabs once with a hidden camera, time-sliced on the loading screen and resumed behind later black screens (teleport, respawn, sleep) until every combination is done, so first-sight shader compiles (new biome, first fire, first creature) stop hitching in play. Trace (D3D12/Vulkan only): records which shader/pipeline states the game draws with (Unity GraphicsStateCollection trace), saves them per game version and graphics API, and pre-compiles them a few per frame after the next spawn, so first-sight hitches (new biome, first fire, first creature) happen early and spread out. No visual change.
# Setting type: Boolean
# Default value: true
Enabled = true

## Graphics states pre-created per frame while warming.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 64
Warm Per Frame = 4

## Any graphics API (D3D11 included): on each world load, draw every distinct shader/keyword combination of the loaded prefabs (creatures, trees, rocks, pieces, vegetation, grass, particles) once with a hidden camera far above the world, so first-sight shader compiles happen on the loading screen instead of in play. Time-sliced by the budgets below.
# Setting type: Boolean
# Default value: true
Prefab Warm = true

## Milliseconds per frame spent on the prefab warm-up while the loading screen is up (world load, teleport, respawn). Read live.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 100
Loading Budget Ms = 10

## Milliseconds per frame for a prefab warm-up still unfinished after spawning (0 = no play frames: the warm-up runs only behind loading screens, paused at spawn and resumed behind later black screens per Resume Behind Loading Screens, else stopped at spawn; FastStartup SpikeProbe put first-seen shader variants at 1-4 % of spike time, so it must not cost play frames). Read live.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 10
Play Budget Ms = 0

## A prefab warm-up still unfinished at spawn (short loading screen) pauses instead of stopping and continues, with the Loading Budget Ms, on every later frame the game's black screen fully covers the picture (teleport, death, respawn, sleep), until done or Max Total Ms. Never in visible play frames beyond Play Budget Ms.
# Setting type: Boolean
# Default value: true
Resume Behind Loading Screens = true

## Total milliseconds the prefab warm-up may spend per world load; it stops there. Read live.
# Setting type: Single
# Default value: 4000
# Acceptable value range: From 100 to 60000
Max Total Ms = 4000

## Seconds of play recorded after the first spawn of each game start (0 = never record, only warm an existing file).
# Setting type: Int32
# Default value: 600
# Acceptable value range: From 0 to 7200
Trace Seconds = 600

[Perf.Stations]

## Production stations without idle busywork: a smelter-type station (smelter, kiln, furnace, windmill, spinning wheel, eitr refinery) that cannot work (no fuel, no ore, no roof, smoke blocked) skips its per-second catch-up loop in one step with a bit-identical result.
# Setting type: Boolean
# Default value: true
Enabled = true

## An idle station's offline catch-up (up to 3600 one-second steps that change nothing) is done in one step. Bit-identical: only the leftover fraction of the accumulator remains, exactly as after the vanilla loop.
# Setting type: Boolean
# Default value: true
Smelter Idle Fast-Forward = true

[Perf.Streaming]

## Client: ZNetScene creates streamed-in objects by a per-pass TIME budget instead of a count (vanilla max(pending/100, 10) Instantiate+Awake per 30 Hz pass, 20-30 at once on entering a new zone). Vanilla order and checks (what the camera faces first, also on the frames between passes); at least one object per pass; larger budget when standing still and on the loading screen.
# Setting type: Boolean
# Default value: true
Enabled = true

## Milliseconds per creation pass (ZNetScene runs one at most 30x per second; with Every Frame also each frame between) spent instantiating streamed-in objects in play. At least one object is created per pass, so a single expensive prefab can still take longer. Read live.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 0,5 to 50
Budget Ms = 2.5

## Milliseconds per creation pass while the loading screen is up (world load before the first spawn, respawn, teleport). Read live.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 1 to 500
Loading Budget Ms = 40

## A creation pass also stops before an object whose prefab has measured more creation time (running average of its own Instantiate + Awake) than the pass has left, so a heavy prefab (big tree, ship, ruin, dungeon) starts the next pass alone instead of landing on top of others. Order unchanged; every pass still creates at least one object. Read live.
# Setting type: Boolean
# Default value: true
Cost Aware = true

## Within the game's creation order (type first), building pieces at about the same distance (8 m bands) are created most-supported first (stored support / the material's maximum), so a base streams in from its foundations up instead of in distance order. Read live.
# Setting type: Boolean
# Default value: true
Foundation First = true

## While a respawn or teleport loading screen is up, install the zones around the destination (nearest first) until this many milliseconds per zone tick are spent, instead of the game's one zone per 0.1 s tick. Same zones, same spawn path; in play the game's cadence runs. 0 = vanilla. Read live.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 200
Loading Zone Budget Ms = 30

## Milliseconds per creation pass in play once you have stood within 1 m for a second (the base around you is the backlog; a moving player keeps Budget Ms). Read live.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0,5 to 50
Stationary Budget Ms = 5

## In play the per-pass budget grows to the game's own creation rate for the current backlog (a hundredth of the waiting objects per pass) at the measured cost per object, up to this many milliseconds, so a big base keeps up with you instead of trailing behind. Read live.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0,5 to 50
Backlog Cap Ms = 8

## Within the game's creation order (type first), objects more than 4 m away outside the camera's view cone are ordered as if twice as far, so what you look at streams in before what is behind you. Read live.
# Setting type: Boolean
# Default value: true
Visible First = true

## Keep creating from the last creation pass's queue on the frames between the game's passes (it runs them at most 30x per second), under the same per-frame budget, so a high frame rate streams a base in proportionally faster without longer frames. Read live.
# Setting type: Boolean
# Default value: true
Every Frame = true

## Client (never on the server or host): while the simulated area around you is still loading (join, respawn, teleport, fast travel), an object is created as soon as its own zone and the 8 around it are loaded and nothing of a higher creation class (terrain edits before building pieces before the rest) is still waiting in those zones, instead of nothing at all until every zone of the area is loaded. Building pieces and physics bodies (items, carts, ships, creatures) keep the game's rule and wait for the whole area, and anything near a waiting piece waits with it. Same order, checks and budget; once the area is loaded the game's rule runs. Read live.
# Setting type: Boolean
# Default value: true
Neighbourhood Gate = true

[Perf.Terrain]

## Terrain hot paths without visual change: heightmap lookup index, heightmap builder thread throughput (bigger ready queue, no sleep while work is queued), and render-mesh rebuilds that skip re-uploading the unchanged UVs and triangle indices and take each biome colour once per tile. Deep-snow trails save and send the terrain patch at most once per second instead of per footstep, and the far terrain re-placement every 256 m is spread over 9 frames. Opt-in (visible): a wider ring of distant zones.
# Setting type: Boolean
# Default value: true
Enabled = true

## Heightmap.FindHeightmap / HaveQueuedRebuild answer from a 64 m grid index instead of scanning every loaded heightmap. Same answer as vanilla, including points on a shared edge (first match in load order).
# Setting type: Boolean
# Default value: true
Heightmap Index = true

## Debug: every indexed lookup also runs the vanilla scan and counts mismatches (pf stats Terrain.indexMismatch). Costs more than vanilla while on.
# Setting type: Boolean
# Default value: false
Heightmap Index Verify = false

## HeightmapBuilder thread: ready-queue cap from 'Builder Ready Cap' instead of 16 and no 10 ms sleep while builds are queued. Needs a game restart to install (the thread starts once per process); turning it off takes effect at once.
# Setting type: Boolean
# Default value: true
Builder Throughput = true

## Client and listen host (not a dedicated server): a few helper threads (half the CPU threads minus one, 1-4) build queued terrain heightmaps alongside the game's single builder thread, through the same queue and the same build code, so a ring of new zones (join, teleport, sailing) is ready sooner. While they run, finished builds kept for pickup are raised to the simulated ring's zone count (bounded). Parks itself while another mod patches the heightmap build or world generator path. Needs a game restart to install; turning it off stops the helpers at once.
# Setting type: Boolean
# Default value: true
Parallel Builds = true

## Client and listen host: while you move at 10 m/s or more (ship, cart, flying), the terrain of the zones around the point 2 s ahead (at most 384 m) is queued for building early (bounded by the builder's pickup budget), so the zones install without waiting on the builder when they enter range. Zones are not installed ahead; nothing is narrowed or removed. Read live.
# Setting type: Boolean
# Default value: true
Travel Look-Ahead = true

## Client: a queued terrain re-generate (a rock, building or other terrain modifier streaming in) of a tile more than 30 m from you waits for the next frame once this frame's streaming work has used 'Streaming Budget Ms' ([Core]) and a re-generate already ran this frame. Tiles near you, loading screens and every forced re-generate run at once; a tile waits at most about 30 frames. Read live.
# Setting type: Boolean
# Default value: true
Rebuild Pacing = true

## Finished terrain builds kept for pickup (vanilla 16). A build evicted before the main thread picks it up is built again while the main thread waits.
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 16 to 256
Builder Ready Cap = 32

## Opt-in, visible: how many zone rings (64 m each) of distant objects (large landmark props flagged distant) load beyond the simulated ones. 0 = the game's value (2 at every Simulation Distance level). Must be the same on the server and every client: the server streams those objects only as far as its own value, and the game's distance negotiation cannot compare two values whose far rings differ. The ring is generated and saved into the world like any visited zone, so keep it small. Applies at startup.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 4
Far Zone Rings = 0

## A heightmap rebuild re-uploads only vertices and colours; UVs and triangle indices of the same-size mesh are unchanged. A first build (zone streaming in) uploads the same channels as the game, with UVs built once per tile size. Vertex colours take each biome colour once per tile instead of four calls per vertex (same result; Seasonality's per-call season patch made those calls the larger part of a rebuild). Normals, tangents and bounds are still recalculated synchronously. Client only.
# Setting type: Boolean
# Default value: true
Render Mesh Trim = true

## Client: a full terrain re-generate (a rock, copper deposit or building streaming in or out, a remote terrain edit that only paints) whose heights come out bit-identical to the ones the tile's meshes were built from keeps the collision mesh, its physics cook, the render mesh and the corner depths, and runs as the game's own paint-only re-generate (the paint mask is still rebuilt and bound). Any difference in heights, build data, size, position, material or meshes rebuilds in full. Needs Render Mesh Trim's patch (client).
# Setting type: Boolean
# Default value: true
Rebuild Skip Unchanged = true

## Debug: a re-generate that would be skipped runs in full instead and its new render mesh (vertices, normals, colours) is compared with the kept one; mismatches counted in pf stats Terrain.skipVerifyMismatch. Costs more than vanilla while on.
# Setting type: Boolean
# Default value: false
Rebuild Skip Verify = false

## Client: when a zone unloads, its terrain collision mesh (already cooked) and render mesh are kept up to this many MB (estimated CPU + GPU/cooked copies, about 0.9 MB per zone); a zone that loads again with bit-identical heights at the same spot takes them back instead of rebuilding, cooking and recalculating normals (runs as the game's paint-only re-generate, like Rebuild Skip Unchanged). Oldest kept zones go first; 0 = off. Needs Rebuild Skip Unchanged. Read live.
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 0 to 256
Re-entry Mesh Cache MB = 32

## Deep-snow trails (and other paint-only terrain edits: snow melt, cultivate paint) save the terrain patch at most once per this many seconds instead of once per footstep; every peer then receives and unpacks one blob per interval instead of one per metre walked. Your own trail is drawn at once as before; others see it within this delay. Any height edit (dig, level, raise, smooth), an ownership hand-over, a world save and the patch unloading save the pending trail at once. 0 = save every edit (game behaviour). Read live.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
Snow Save Interval Sec = 1

## Client: the far terrain (distant LOD, 9 tiles out to about 1.2 km) is re-placed every 256 m you travel; the game rebuilds all 9 tiles in one frame (11-16 ms hitch measured). On: one tile per frame, nearest first, so the step is spread over 9 frames. Read live.
# Setting type: Boolean
# Default value: true
Distant Lod Spread = true

## Client: a trimmed render-mesh rebuild of a tile whose build data and position did not change since its colours were uploaded, and whose biome colours still come out the same (e.g. no Seasonality season change since), keeps them instead of recomputing and re-uploading them.
# Setting type: Boolean
# Default value: true
Render Mesh Color Cache = true

[Perf.TransformSync]

## Remote objects with a physics body (drops, ragdolls, logs, debris, other peers' creatures): one physics transform flush per network sync pass instead of one per object, and resting bodies skip the per-frame network sync work until something moves them. Same poses and sleep states as vanilla.
# Setting type: Boolean
# Default value: true
Enabled = true

## Resting physics objects (drops, logs, debris) skip the per-frame network position sync while nothing about them changes: asleep, untouched and no new network update. Anything that moves them, a new update or an ownership change wakes them at once. Read live.
# Setting type: Boolean
# Default value: true
Dormant Sync = true

## Testing: never skip a resting object; run the game's sync anyway and count every frame where it changed something the skip would have missed (pf stats dormantMismatch). Read live.
# Setting type: Boolean
# Default value: false
Dormant Verify = false

