## Settings file was created by plugin Morgott.Performance v0.17.16
## Plugin GUID: morgott.valheim.performance

[Core]

## Server/host: drop every routed RPC whose claimed sender is not the peer that delivered it (vanilla trusts it). Off = only Morgott.Performance's own RPCs are protected; forged vanilla/mod RPCs are counted and passed on.
# Setting type: Boolean
# Default value: true
Reject Spoofed Senders = true

## A networked object destroyed behind ZNetScene's back (Object.Destroy by a mod, or a nested network object dying with its parent, e.g. the Infested Mine coin pile effect on other players' clients) is unloaded the way ZNetScene.RemoveObjects unloads (ZNetScene.cs:310-316): its ZDO stops counting as created and, if this machine owns a non-persistent one, it is destroyed. Without it ZNetScene.IsAreaReady (:156-174) waits for that object for ever: teleport, portal and respawn loading screens near it never lift. Off = only the stale map entry is dropped.
# Setting type: Boolean
# Default value: true
Dead Entry Unload = true

## Per-frame time for Morgott.Performance's periodic scans (module ticks). Past it, a due scan waits for the next frame; none waits longer than 5x its interval. Default 1 ms on a client, 2 ms on a dedicated server.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 20
Frame Budget Ms = 2

## One per-frame time budget shared by all streaming work in play: object creation, dungeon rooms, sliced zone generation, proxy locations and distant terrain rebuilds. Each still has its own limit and always does at least one unit per frame; loading screens are exempt. Read live.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 1 to 50
Streaming Budget Ms = 8

[Diagnostics]

## Debug only. Times every Harmony handler and component update of the other Morgott mods during the first local-player spawn (spawn frame + 3 frames) and every Epic Loot death roll (with Epic Loot's own roll stages), and logs per-handler ms, managed MB and garbage collections to the BepInEx log. Costs a little on every timed call while on. Read at game start.
# Setting type: Boolean
# Default value: false
ProfileSpikes = false

