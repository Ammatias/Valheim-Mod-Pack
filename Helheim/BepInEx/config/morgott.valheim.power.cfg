[Armor]

## Armor removes a fixed share of every hit, whatever its size: reduction = ReductionLimit * (1 - exp(-armor / ArmorScale)). Every armor point removes less than the one before and the limit is never reached, so there is no hard cap. Epic Loot's percentage resistances (fire, frost, lightning, poison, spirit, blunt, slash, pierce, elemental, physical), its night damage reduction and vanilla resistances per damage type (Slightly / Resistant / Very resistant from gear, meads and status effects: 25 / 50 / 75%) are turned into the armor that alone removes the same share and added to the armor, so they stack with diminishing returns instead of multiplying toward immunity; each alone keeps its value. Immune stays immune, Weak / Very weak / Slightly weak still multiply the hit, chop and pickaxe stay vanilla. Creatures at world level 1+ get their world-level armor on the same curve (60 / 120 / 180 armor = 38 / 59 / 71% at world level 1 / 2 / 3) and pool their resistances with it. Vanilla subtracts the armor from big hits and squares small ones away, so weak mobs do almost nothing against modest armor while big hits one-shot through good armor. Shield blocks stay vanilla. Applies after a restart. [Synced with Server]
# Setting type: Boolean
# Default value: true
Enabled = true

## Armor at which the reduction reaches 63% of ReductionLimit (K). Lower = armor stronger. With the defaults the best max-quality vanilla set of each biome gives: Meadows 28 armor = 21%, Black Forest 46 = 31%, Swamp 64 = 40%, Mountain 82 = 48%, Plains 100 = 54%, Mistlands 118 = 59%, Ashlands 150 = 66%. [Synced with Server]
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 1000
ArmorScale = 100

## Share of a hit that armor, Epic Loot reductions and vanilla resistances together approach but never reach (0.85 = 85%). A lower limit also makes early armor slightly stronger for the same late-game reduction. [Synced with Server]
# Setting type: Single
# Default value: 0.85
# Acceptable value range: From 0,1 to 0,99
ReductionLimit = 0.85

BlockCurve = true

BlockArmorScale = 0.7

