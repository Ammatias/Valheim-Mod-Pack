[Compat]

## Give other mods' icon-less damage-over-time and slow effects (Warfare bleeding / impale, Epic Loot paralyze) an icon, so they show on the HUD and on enemy status rows. Takes effect on the next game launch.
# Setting type: Boolean
# Default value: true
ModStatusIcons = true

## Translate CurrencyPocket's hardcoded English "Coin Drop" tooltip into the game language. Does nothing without CurrencyPocket.
# Setting type: Boolean
# Default value: true
CurrencyPocketTooltip = true

## Translate ValheimBuildCamera's hardcoded English HUD texts into the game language. Does nothing without it.
# Setting type: Boolean
# Default value: true
BuildCameraText = true

## Translate the hardcoded English texts of RossItemDrawers, PlantEasily, ValheimPlus and PlantEverything into the game language. Does nothing without them.
# Setting type: Boolean
# Default value: true
ModText = true

[Diagnostics]

## Take a family only when its theme assets loaded (otherwise the other skin keeps it). Off = take it anyway (development before the art bundle exists). Read once at startup.
# Setting type: Boolean
# Default value: true
RequireAssets = true

## Write development diagnostics to the log: skin counts per screen (diag), mod panel units, HUD strip keep-out moves. Warnings (unknown graphics, theme issues) are always written.
# Setting type: Boolean
# Default value: false
VerboseLog = false

## Reload the theme when the override BepInEx\config\Morgott.UI\theme.json is written (0.5 s after the last change; same as the ui_reload console command). The override lists only the entries it changes (layered over the shipped theme; // comments allowed). Read once at startup.
# Setting type: Boolean
# Default value: true
WatchTheme = true

[Hud]

## Scale of the bottom strip (its cells, frames and gaps; the inventory grid shares the strip's cell), the minimap ring and the HUD margins on top of the game's UI scale. Fonts never go below the readable floor.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,75 to 1,5
Scale = 1

## Minimap ring size on top of the theme size (size.minimap.ring) and Hud.Scale; its height cap (share.minimap.ring.h) scales with it. Applied live.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,6 to 1,6
MinimapScale = 1

## On 21:9 and wider screens the HUD corners are those of a centred 16:9 box (off = true screen corners).
# Setting type: Boolean
# Default value: true
UltrawideBox = true

## Opens / closes the full list of status effects when the strip shows a +N cell.
# Setting type: KeyboardShortcut
# Default value: F7
StatusListKey = F7

## Gamepad: this ZInput button while JoyAltKeys is held opens / closes the full status list. Empty = none.
# Setting type: String
# Default value: JoyDPadDown
StatusListGamepadButton = JoyDPadDown

## Opens / closes the character stats window (with the inventory). None = only the inventory info button.
# Setting type: KeyboardShortcut
# Default value: None
StatsKey = 

## Seconds between value updates of the open character stats window.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0,05 to 2
StatsRefresh = 0.25

## Character stats resistances: the share of a hit of this size, per damage type, that Epic Loot, resistances and armor remove (the game's own damage steps run on it).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 1000
StatsReferenceHit = 100

## Smart = overhead enemy bars only for the aimed enemy (+ linger), enemies you fought recently and the nearest alerted threats, capped; Vanilla = every hovered enemy for 60 s (vanilla rule).
# Setting type: EnemyBarMode
# Default value: Smart
# Acceptable values: Smart, Vanilla
EnemyBars = Smart

## Smart: most overhead enemy bars at once (the aimed one always counts first).
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 16
EnemyBarsMax = 4

## Smart: most bars shown only because an enemy is alerted nearby.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 0 to 16
EnemyBarsThreats = 2

## Smart: seconds the aimed enemy's bar stays after the crosshair leaves it.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 10
EnemyBarsLinger = 1.5

## Smart: seconds an enemy's bar stays after you hit it or it hit you (refreshed by every hit).
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 60
EnemyBarsEngaged = 8

## Smart: metres within which an alerted enemy counts as a threat.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 40
EnemyBarsThreatRange = 15

## Smart: creation radius of overhead bars in metres (vanilla 10; bars shrink to 0.8 at 20 m). Applied on world load.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 10 to 40
EnemyBarsRange = 20

## Screen share a boss bar spans, spear tip to spear tip (of a 16:9 box on ultrawide screens), for boss-flagged creatures that are not Vaettir's world boss (Vaettir's own bar: its BossBar.Width). The approved mockup boss-c is 0.95; 0.64 keeps the bar clear of the minimap.
# Setting type: Single
# Default value: 0.64
# Acceptable value range: From 0,2 to 0,98
BossBarWidth = 0.64

## Dark outline width (TMP SDF units) of every HUD number (bar values, slot keys / counts / timers, status timers); with a soft dark shadow, so white digits read on white. Applies on the next start or theme reload.
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From 0 to 0,4
NumberOutline = 0.18

