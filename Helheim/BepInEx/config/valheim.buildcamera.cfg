## Settings file was created by plugin Valheim Build Camera v0.1.48
## Plugin GUID: valheim.buildcamera

[Building]

## Base reach from your character's eyes, multiplied by FreeCameraRangeMultiplier only while free camera is active. Default 25 x 8 = 200 metres. Normal player reach is restored on exit; native building rules still apply.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 5 to 25
BuildReach = 25

[Camera]

## Camera movement in metres per second.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 15
MoveSpeed = 6

## Hold your Run control for faster camera movement.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 3
FastMultiplier = 2

## Base camera radius in metres, multiplied by FreeCameraRangeMultiplier. Default 25 x 8 = 200 metres around the stationary body.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 8 to 25
CameraRadius = 25

## Multiply both base camera radius and active build reach, from 1 to 8. Default 8 gives a 200 metre radius with the default 25 metre base. Does not affect normal player building reach. World streaming distances are unchanged.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 1 to 8
FreeCameraRangeMultiplier = 8

[Compatibility]

## Tracks the one-time 0.1.48 upgrade to 200 metres. Leave true to retain your later range adjustments.
# Setting type: Boolean
# Default value: false
Range200mUpgradeApplied = true

[Controls]

## Enter/leave build camera with a hammer or another building tool equipped.
# Setting type: KeyboardShortcut
# Default value: F6
ToggleKey = F6

## Reset the active camera to its initial angled view.
# Setting type: KeyboardShortcut
# Default value: F7
ResetViewKey = F7

## Write camera diagnostics, exit camera mode, and reload configuration. Separate from Larger HUD's F8.
# Setting type: KeyboardShortcut
# Default value: F10
ReloadAndReportKey = F10

## Press both stick buttons together to enter/leave. A building tool is needed to enter, but not to leave. Release both before toggling again.
# Setting type: Boolean
# Default value: true
ControllerStickToggle = true

## Toggle live multi-build in the build camera. F9 / LB+Y: on/off. D-pad: width/height. LB+Up/Down: layout. Shift+F9: layout. Arrow keys: resize. Starts in single-piece mode.
# Setting type: KeyboardShortcut
# Default value: F9
GridOptionsKey = F9

## While free build camera is active, toggle local sunny noon and hide weather fog/Mistlands mist. Real time/weather keep running. Restores on camera exit.
# Setting type: KeyboardShortcut
# Default value: F11
ClearBuildingViewKey = F11

## Hold left stick click and press Y (L3 + Triangle) in free build camera to toggle clear midday lighting and mist removal.
# Setting type: Boolean
# Default value: true
ClearBuildingViewController = true

[General]

## Enable the build camera on this client.
# Setting type: Boolean
# Default value: true
Enabled = true

[Safety]

## Exit immediately when the physical player takes damage. Set false only if you deliberately want environmental damage to be tolerated; death still exits.
# Setting type: Boolean
# Default value: true
ExitOnDamage = true

## Show a small support estimate for the placement ghost while build camera is active.
# Setting type: Boolean
# Default value: true
PlacementSupportPreview = true

## While build camera is active, aim at a removable piece to preview additional support collapses. Orange target, red affected pieces, estimated count. Read-only and bounded; unsupported or oversized scans show unavailable. Set false to disable.
# Setting type: Boolean
# Default value: true
DismantleCollapsePreview = true

[View]

## Hide your character's renderers on your own screen while active. Your body remains in the world.
# Setting type: Boolean
# Default value: true
HideLocalPlayer = true

## Small top-centre reminder while the build camera is active.
# Setting type: Boolean
# Default value: true
ShowIndicator = true

## Downward angle when entering/resetting the camera. Mouse/right stick can adjust it afterward.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 20 to 75
StartingPitch = 50

## Starting perspective field of view. Page Up/Down zoom while active; mouse wheel keeps rotating pieces.
# Setting type: Single
# Default value: 45
# Acceptable value range: From 25 to 75
FieldOfView = 45

